# Full TLS config for threeoone.us (use after certbot has issued certs).

upstream next_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:3001;
}

server {
    listen 80;
    server_name threeoone.us www.threeoone.us;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name api.threeoone.us;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name threeoone.us www.threeoone.us;

    ssl_certificate     /etc/letsencrypt/live/threeoone.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threeoone.us/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.threeoone.us;

    ssl_certificate     /etc/letsencrypt/live/threeoone.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threeoone.us/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
